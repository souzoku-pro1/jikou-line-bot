<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>相続案件ダッシュボード - 案件管理（仮）</title>
<style>
/* UI-POLISH-1: セクションカード型（質問画面と統一の配色）。read-only は不変 */
body{font-family:sans-serif;max-width:720px;margin:0 auto;
  padding:.6rem 1rem 2rem;box-sizing:border-box;background:#eef1f5;color:#222}
h1{font-size:1.25rem;margin:.4rem 0 .1rem}
h2{font-size:1rem;margin:1rem 0 .3rem;color:#334}
.sub{color:#667;font-size:.85rem;margin:0 0 .6rem}
a{color:#1a3c6e}
.card{background:#fff;border:1px solid #d8dde5;border-radius:14px;
  padding:.7rem 1rem;margin:.5rem 0}
.kv{display:flex;gap:.8rem;padding:.35rem 0;border-bottom:1px solid #eef1f5;
  font-size:.95rem}
.kv:last-child{border-bottom:none}
.kv .k{flex:0 0 9em;color:#667}
.kv .va{flex:1;word-break:break-word}
.item{background:#fff;border:1px solid #d8dde5;border-radius:14px;
  padding:.65rem .9rem;margin:.45rem 0}
.name{font-size:1rem;font-weight:bold}
.badges{margin:.25rem 0}
.badge{display:inline-block;border-radius:999px;padding:.12rem .6rem;
  font-size:.78rem;background:#e3e7ee;color:#445;margin:.1rem .35rem .1rem 0}
.badge.ok{background:#e5f4e6;color:#256d2a}
.badge.warn{background:#fff3d6;color:#8a6d00}
.badge.info{background:#e8f0fb;color:#1a5cb0}
.detail{font-size:.88rem;color:#334;margin-top:.2rem}
.links{font-size:.82rem;margin-top:.3rem}
.links a{margin-right:.8rem}
.meta{color:#8a8f98;font-size:.78rem;margin-top:.25rem}
.muted{color:#98a0ab}
.notice{background:#fff7e0;border:1px solid #e0c060;border-radius:12px;
  padding:.6rem .8rem;font-size:.85rem;margin:.5rem 0}
.warn-note{color:#a04000;font-size:.85rem;margin:.2rem 0}
.total{font-size:.95rem;font-weight:bold;color:#1a3c6e;margin:.4rem 0}
.empty{color:#667;margin:.4rem 0}
</style>
</head>
<body>
<h1>相続案件ダッシュボード</h1>
<p class="sub"><a href="/app/souzoku">← 相続案件の一覧へ戻る</a></p>
<!-- PWA-BATCH-1 B(ii)(iv): read-only の1画面参照ビュー。確定・承認・編集の
     操作 UI は一切置かない（機械は確定しない）。状態注記は表示する -->
<p class="notice" id="notice"></p>
<h2>案件情報</h2>
<div class="card" id="case"></div>
<h2>進行状況</h2>
<div class="card" id="progress"></div>
<h2>相続人</h2>
<p class="warn-note" id="heirs-note"></p>
<div id="heir-rows"></div>
<h2>人物情報</h2>
<p class="warn-note" id="persons-note"></p>
<div id="person-rows"></div>
<h2>財産目録</h2>
<p class="warn-note" id="assets-note"></p>
<div id="asset-rows"></div>
<h2>書類（発送・受領）</h2>
<p class="warn-note" id="docs-note"></p>
<div id="doc-rows"></div>
<script src="/app/app.js"></script>
<script src="/app/shell.js"></script>
<script>
function v(rec, name) { return (rec[name] && rec[name].value) || ""; }
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) { node.className = cls; }
  if (text !== undefined) { node.textContent = text; }
  return node;
}
function disp(text) {
  return text ? document.createTextNode(text) : el("span", "muted", "未登録");
}
// UI-POLISH-1-fix1（UI-POLISH-02）: 日時表示の単一の正（全画面で逐語同一・
// テストが verbatim pin）。JST は UTC+9 固定（DST なし＝Asia/Tokyo と恒等）を
// UTC 演算のみで適用し、端末タイムゾーンに依存しない（非 UTC getter 不使用を
// 構造 pin）。「今日」判定も JST の日付境界で行う
function jstParts(d) {
  var t = new Date(d.getTime() + 9 * 3600 * 1000);
  var h = t.getUTCHours();
  var mi = t.getUTCMinutes();
  return {y: t.getUTCFullYear(), mo: t.getUTCMonth() + 1, da: t.getUTCDate(),
          hm: (h < 10 ? "0" + h : "" + h) + ":" +
              (mi < 10 ? "0" + mi : "" + mi)};
}
function fmtDate(value) {
  var s = String(value || "");
  if (!s) { return ""; }
  var dOnly = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if (dOnly) {
    return dOnly[1] + "/" + dOnly[2].replace(/^0/, "") + "/" +
      dOnly[3].replace(/^0/, "");
  }
  var d = new Date(s);
  if (isNaN(d.getTime())) { return s; }
  var p = jstParts(d);
  var n = jstParts(new Date());
  if (p.y === n.y && p.mo === n.mo && p.da === n.da) {
    return "今日 " + p.hm;
  }
  return p.y + "/" + p.mo + "/" + p.da + " " + p.hm;
}
function noteFail(id) {
  document.getElementById(id).textContent =
    "このセクションは取得できませんでした（再読み込みで再試行してください）";
}
function recLink(base, appId, recId) {
  if (!base || !appId || !recId) { return document.createTextNode(""); }
  const a = document.createElement("a");
  a.href = base + "/" + encodeURIComponent(appId) + "/show#record=" +
    encodeURIComponent(recId);
  a.textContent = "台帳で開く";
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  return a;
}
// PWA-PDF-LINK: サーバが grammar 検証済みの Drive 直リンク（_pdf_url）のみを
// リンク化する。参照なし行は空（壊れたリンクを出さない）。閲覧は開く人の
// Google ログイン権限に依存（サーバは PDF を中継しない）
function pdfLink(url) {
  if (!url || !url.startsWith("https://drive.google.com/file/d/")) {
    return document.createTextNode("");
  }
  const a = document.createElement("a");
  a.href = url;
  a.textContent = "原本PDF";
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  return a;
}
function kvRow(box, label, value) {
  const row = el("div", "kv");
  row.appendChild(el("div", "k", label));
  const va = el("div", "va");
  if (value instanceof Node) { va.appendChild(value); }
  else if (value) { va.textContent = value; }
  else { va.appendChild(el("span", "muted", "未登録")); }
  row.appendChild(va);
  box.appendChild(row);
}
function confirmBadge(yes, okText, warnText) {
  return yes ? el("span", "badge ok", okText)
             : el("span", "badge warn", warnText);
}
function linksLine(nodes) {
  const line = el("div", "links");
  let any = false;
  for (const n of nodes) {
    if (n && n.textContent) { line.appendChild(n); any = true; }
  }
  return any ? line : null;
}
// PWA-03: 金額表示の固定 format——数字列は文字列のまま3桁区切り（数値化しない
// ＝2^53 超でも桁落ちなし）。grammar 外の値は加工せずそのまま表示
function comma(s) { return s.replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function fmtAmount(s) { return /^[0-9]+$/.test(s) ? comma(s) : s; }
async function load() {
  const id = new URLSearchParams(location.search).get("id") || "";
  if (!/^[0-9]{1,10}$/.test(id)) { document.body.textContent = "URL が不正です"; return; }
  const resp = await app_fetch("/app/api/souzoku/cases/" + id);
  if (resp.redirected || !resp.headers.get("content-type")?.includes("json")) {
    location.href = "/app/login"; return;
  }
  if (!resp.ok) { document.getElementById("case").textContent = "取得できませんでした"; return; }
  const data = await resp.json();
  document.getElementById("notice").textContent = data.notice;
  const links = data.links || null;
  const base = links ? links.base : "";
  const apps = links ? links.apps : {};

  // 案件（相談カード）: PWA-01 閉集合の明示描画（全 field 列挙ループ禁止——
  // field 追加が黙って公開範囲を広げない。表示は下記 6 項目の閉集合のみ）
  const caseBox = document.getElementById("case");
  kvRow(caseBox, "氏名（お客様）", v(data.case, "氏名"));
  kvRow(caseBox, "被相続人名", v(data.case, "被相続人名"));
  kvRow(caseBox, "続柄", v(data.case, "続柄"));
  const stBadge = el("span", "badge info",
    v(data.case, "書類ステータス") || "未設定");
  kvRow(caseBox, "書類の状況", stBadge);
  kvRow(caseBox, "登録日", fmtDate(v(data.case, "登録日時")));
  kvRow(caseBox, "最終更新", fmtDate(v(data.case, "更新日時")));

  // 相続人（App36）
  let heirs = [];
  if (data.heirs.ok) {
    heirs = data.heirs.records;
    const ex = data.heirs.excluded_cancelled_count;
    document.getElementById("heirs-note").textContent =
      ex > 0 ? `取消済み ${ex} 件は表示していません（記録は残っています）` : "";
    const rows = document.getElementById("heir-rows");
    if (!heirs.length) {
      rows.appendChild(el("p", "empty", "相続人の登録はまだありません"));
    }
    for (const rec of heirs) {
      const card = el("div", "item");
      const name = el("div", "name");
      name.appendChild(disp(v(rec, "氏名")));
      card.appendChild(name);
      const badges = el("div", "badges");
      if (v(rec, "続柄")) { badges.appendChild(el("span", "badge", v(rec, "続柄"))); }
      badges.appendChild(confirmBadge(v(rec, "戸籍確認済") === "yes",
        "戸籍確認済", "戸籍未確認"));
      if (v(rec, "状態")) {
        badges.appendChild(el("span", "badge", v(rec, "状態")));
      }
      card.appendChild(badges);
      const bits = [];
      if (v(rec, "法定相続分")) { bits.push("法定相続分 " + v(rec, "法定相続分")); }
      if (v(rec, "印鑑証明")) { bits.push("印鑑証明 " + v(rec, "印鑑証明")); }
      if (bits.length) { card.appendChild(el("div", "detail", bits.join("｜"))); }
      const line = linksLine([recLink(base, apps.heir, v(rec, "$id"))]);
      if (line) { card.appendChild(line); }
      card.appendChild(el("div", "meta", "No." + v(rec, "$id")));
      rows.appendChild(card);
    }
  } else { noteFail("heirs-note"); }

  // 人物（App34）
  let persons = [];
  if (data.persons.ok) {
    persons = data.persons.records;
    const ex = data.persons.excluded_merged_count;
    document.getElementById("persons-note").textContent =
      ex > 0 ? `同一人物として統合済みの ${ex} 件は表示していません` : "";
    const rows = document.getElementById("person-rows");
    if (!persons.length) {
      rows.appendChild(el("p", "empty", "人物情報の登録はまだありません"));
    }
    for (const rec of persons) {
      const card = el("div", "item");
      const name = el("div", "name");
      name.appendChild(disp(v(rec, "氏名")));
      card.appendChild(name);
      const badges = el("div", "badges");
      if (v(rec, "被相続人フラグ") === "yes") {
        badges.appendChild(el("span", "badge info", "被相続人"));
      }
      if (v(rec, "生死区分")) {
        badges.appendChild(el("span", "badge", v(rec, "生死区分")));
      }
      badges.appendChild(confirmBadge(v(rec, "名寄せ確定") === "確定",
        "同一人物確認済", "同一人物未確認"));
      card.appendChild(badges);
      const bits = [];
      if (v(rec, "続柄メモ")) { bits.push(v(rec, "続柄メモ")); }
      if (v(rec, "相続人候補")) { bits.push("相続人候補 " + v(rec, "相続人候補")); }
      if (v(rec, "相続資格")) { bits.push("相続資格 " + v(rec, "相続資格")); }
      if (v(rec, "確認状態")) { bits.push("確認 " + v(rec, "確認状態")); }
      if (bits.length) { card.appendChild(el("div", "detail", bits.join("｜"))); }
      const line = linksLine([recLink(base, apps.person, v(rec, "$id"))]);
      if (line) { card.appendChild(line); }
      card.appendChild(el("div", "meta", "No." + v(rec, "$id")));
      rows.appendChild(card);
    }
  } else { noteFail("persons-note"); }

  // 財産（App35）: 合計はサーバ側の全件整数集計（PWA-02/03）。集計不能・
  // 取得不完全のときは合計を表示しない（不完全な値を完全値として出さない）
  let assets = [];
  if (data.assets.ok) {
    assets = data.assets.records;
    const rows = document.getElementById("asset-rows");
    if (!assets.length) {
      rows.appendChild(el("p", "empty", "財産の登録はまだありません"));
    }
    for (const rec of assets) {
      const card = el("div", "item");
      const name = el("div", "name");
      name.appendChild(disp(v(rec, "財産種別")));
      card.appendChild(name);
      const badges = el("div", "badges");
      badges.appendChild(confirmBadge(v(rec, "評価確定") === "yes",
        "評価確定", "評価未確定"));
      if (v(rec, "有効")) {
        badges.appendChild(el("span", "badge", "有効 " + v(rec, "有効")));
      }
      card.appendChild(badges);
      const bits = [];
      if (v(rec, "評価額")) { bits.push("評価額 " + fmtAmount(v(rec, "評価額")) + " 円"); }
      if (v(rec, "名義")) { bits.push("名義 " + v(rec, "名義")); }
      if (v(rec, "評価方法")) { bits.push(v(rec, "評価方法")); }
      if (v(rec, "評価基準日")) { bits.push("基準日 " + fmtDate(v(rec, "評価基準日"))); }
      if (bits.length) { card.appendChild(el("div", "detail", bits.join("｜"))); }
      const line = linksLine([recLink(base, apps.asset, v(rec, "$id"))]);
      if (line) { card.appendChild(line); }
      card.appendChild(el("div", "meta", "No." + v(rec, "$id")));
      rows.appendChild(card);
    }
    const t = data.assets.total;
    let note = "";
    if (!t.computable) {
      note = "評価額に集計不能な値が含まれるため、合計は表示しません" +
             "（該当の財産の評価額を確認してください）";
      document.getElementById("assets-note").textContent = note;
    } else {
      note = `評価額の合計（有効 ${t.counted} 件）: ${comma(t.amount)} 円`;
      if (t.unconfirmed_count > 0) {
        note += `——未確定の評価 ${t.unconfirmed_count} 件を含む参考値です`;
      }
      if (t.blank_count > 0) {
        note += `／金額未入力 ${t.blank_count} 件は合計に入れていません`;
      }
      document.getElementById("asset-rows")
        .appendChild(el("p", "total", note));
    }
  } else { noteFail("assets-note"); }

  // 直近生成書類（App30）
  if (data.documents.ok) {
    const rows = document.getElementById("doc-rows");
    if (data.documents.records.length === 0) {
      rows.appendChild(el("p", "empty", "この案件の書類記録はまだありません"));
    }
    for (const rec of data.documents.records) {
      const card = el("div", "item");
      const name = el("div", "name");
      name.appendChild(disp(v(rec, "件名")));
      card.appendChild(name);
      const badges = el("div", "badges");
      badges.appendChild(el("span", "badge info",
        v(rec, "発送ステータス") || "状態未設定"));
      if (v(rec, "チャネル")) { badges.appendChild(el("span", "badge", v(rec, "チャネル"))); }
      if (v(rec, "方向")) { badges.appendChild(el("span", "badge", v(rec, "方向"))); }
      card.appendChild(badges);
      const fv = v(rec, "成果物");
      const files = Array.isArray(fv) ? fv.map((f) => f.name).join(" / ") : "";
      const bits = [];
      if (v(rec, "発送日時")) { bits.push("発送 " + fmtDate(v(rec, "発送日時"))); }
      if (files) { bits.push("ファイル " + files); }
      if (bits.length) { card.appendChild(el("div", "detail", bits.join("｜"))); }
      const line = linksLine([pdfLink(rec._pdf_url),
                              recLink(base, apps.shipping, v(rec, "$id"))]);
      if (line) { card.appendChild(line); }
      card.appendChild(el("div", "meta", "No." + v(rec, "$id")));
      rows.appendChild(card);
    }
  } else { noteFail("docs-note"); }

  // 進行状況（機械的データのみ・法務判断の自動化なし）
  const prog = document.getElementById("progress");
  const stBadge2 = el("span", "badge info",
    v(data.case, "書類ステータス") || "未設定");
  kvRow(prog, "書類の状況", stBadge2);
  if (data.derivation.ok) {
    const head = data.derivation.head;
    kvRow(prog, "相続人の自動判定",
          head ? `判定 #${head.run_id}（${head.run_status}）` +
                 (head.provisional ? "・暫定（未確定）" : "")
               : "まだ実行されていません");
  } else {
    kvRow(prog, "相続人の自動判定", "取得できませんでした");
  }
  if (data.heirs.ok) {
    const conf = heirs.filter((r) => v(r, "戸籍確認済") === "yes").length;
    kvRow(prog, "相続人",
          `${heirs.length} 名（うち戸籍確認済 ${conf} 名）` +
          (data.heirs.excluded_cancelled_count > 0
            ? `・取消済み ${data.heirs.excluded_cancelled_count} 件は非表示` : ""));
  }
  if (data.persons.ok) {
    const un = persons.filter((r) => v(r, "名寄せ確定") !== "確定").length;
    kvRow(prog, "人物情報",
          `${persons.length} 名（うち同一人物未確認 ${un} 名）` +
          (data.persons.excluded_merged_count > 0
            ? `・統合済み ${data.persons.excluded_merged_count} 件は非表示` : ""));
  }
  if (data.assets.ok) {
    const fixed = assets.filter((r) => v(r, "評価確定") === "yes").length;
    kvRow(prog, "財産", `${assets.length} 件（うち評価確定 ${fixed} 件）`);
  }
}
load();
</script>
</body>
</html>
