<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案件詳細 - 案件管理（仮）</title>
<style>
/* UI-POLISH-1: セクションカード型（質問画面と統一の配色） */
body{font-family:sans-serif;max-width:720px;margin:0 auto;
  padding:.6rem 1rem 2rem;box-sizing:border-box;background:#eef1f5;color:#222}
h1{font-size:1.25rem;margin:.4rem 0 .1rem}
h2{font-size:1rem;margin:1rem 0 .3rem;color:#334}
.sub{color:#667;font-size:.85rem;margin:0 0 .6rem}
a{color:#1a3c6e}
.card{background:#fff;border:1px solid #d8dde5;border-radius:14px;
  padding:.7rem 1rem;margin:.5rem 0}
.kv{display:flex;gap:.8rem;padding:.35rem 0;border-bottom:1px solid #eef1f5;
  font-size:.95rem}
.kv:last-child{border-bottom:none}
.kv .k{flex:0 0 9em;color:#667}
.kv .va{flex:1;word-break:break-all;white-space:pre-wrap}
.badge{display:inline-block;border-radius:999px;padding:.12rem .6rem;
  font-size:.78rem;background:#e8f0fb;color:#1a5cb0;margin-right:.4rem}
.meta{color:#8a8f98;font-size:.78rem;margin-top:.25rem}
.muted{color:#98a0ab}
.name{font-size:1rem;font-weight:bold}
</style>
</head>
<body>
<h1>案件詳細</h1>
<p class="sub">時効案件（表示のみ）｜<a href="/app/cases">← 一覧へ戻る</a></p>
<!-- P4-002: read-only（表示のみ）。kintone レコードの素通し表示（裁定: 内部専用・
     kintone 直視と同格）。App28 は件数のみ（本文表示は別票） -->
<h2>案件情報</h2>
<div class="card" id="case"></div>
<h2>発送・受領の記録</h2>
<div id="shipping"></div>
<h2>LINE のやり取り</h2>
<div class="card"><span id="chat"></span></div>
<script src="/app/app.js"></script>
<script src="/app/shell.js"></script>
<script>
function v(rec, name) { return (rec[name] && rec[name].value) || ""; }
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) { node.className = cls; }
  if (text !== undefined) { node.textContent = text; }
  return node;
}
function disp(text) {
  return text ? document.createTextNode(text) : el("span", "muted", "未登録");
}
// UI-POLISH-1-fix1（UI-POLISH-02）: 日時表示の単一の正（全画面で逐語同一・
// テストが verbatim pin）。JST は UTC+9 固定（DST なし＝Asia/Tokyo と恒等）を
// UTC 演算のみで適用し、端末タイムゾーンに依存しない（非 UTC getter 不使用を
// 構造 pin）。「今日」判定も JST の日付境界で行う
function jstParts(d) {
  var t = new Date(d.getTime() + 9 * 3600 * 1000);
  var h = t.getUTCHours();
  var mi = t.getUTCMinutes();
  return {y: t.getUTCFullYear(), mo: t.getUTCMonth() + 1, da: t.getUTCDate(),
          hm: (h < 10 ? "0" + h : "" + h) + ":" +
              (mi < 10 ? "0" + mi : "" + mi)};
}
function fmtDate(value) {
  var s = String(value || "");
  if (!s) { return ""; }
  var dOnly = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if (dOnly) {
    return dOnly[1] + "/" + dOnly[2].replace(/^0/, "") + "/" +
      dOnly[3].replace(/^0/, "");
  }
  var d = new Date(s);
  if (isNaN(d.getTime())) { return s; }
  var p = jstParts(d);
  var n = jstParts(new Date());
  if (p.y === n.y && p.mo === n.mo && p.da === n.da) {
    return "今日 " + p.hm;
  }
  return p.y + "/" + p.mo + "/" + p.da + " " + p.hm;
}
const ISO_DT = /^\d{4}-\d{2}-\d{2}(T|\s)\d{2}:/;
function smart(value) {
  if (typeof value === "string" && (ISO_DT.test(value) ||
      /^\d{4}-\d{2}-\d{2}$/.test(value))) {
    return document.createTextNode(fmtDate(value));
  }
  return disp(typeof value === "string" ? value : JSON.stringify(value));
}
function kv(box, label, node) {
  const row = el("div", "kv");
  row.appendChild(el("div", "k", label));
  const va = el("div", "va");
  va.appendChild(node);
  row.appendChild(va);
  box.appendChild(row);
}
async function load() {
  const id = new URLSearchParams(location.search).get("id") || "";
  if (!/^[0-9]{1,10}$/.test(id)) { document.body.textContent = "URL が不正です"; return; }
  const resp = await app_fetch("/app/api/cases/" + id);
  if (resp.redirected || !resp.headers.get("content-type")?.includes("json")) {
    location.href = "/app/login"; return;
  }
  if (!resp.ok) { document.getElementById("case").textContent = "取得できませんでした"; return; }
  const data = await resp.json();
  const caseBox = document.getElementById("case");
  for (const [name, field] of Object.entries(data.case)) {
    if (name.startsWith("$")) continue;
    kv(caseBox, name, smart(field.value));
  }
  const ship = document.getElementById("shipping");
  if (!data.shipping.length) {
    ship.appendChild(el("div", "card muted", "発送・受領の記録はありません"));
  }
  for (const rec of data.shipping) {
    const card = el("div", "card");
    const name = el("div", "name");
    name.appendChild(disp(v(rec, "件名")));
    card.appendChild(name);
    const line = el("div", "");
    line.appendChild(el("span", "badge",
      v(rec, "発送ステータス") || "状態未設定"));
    if (v(rec, "チャネル")) {
      line.appendChild(el("span", "badge", v(rec, "チャネル")));
    }
    if (v(rec, "方向")) {
      line.appendChild(el("span", "badge", v(rec, "方向")));
    }
    card.appendChild(line);
    const detail = el("div", "meta");
    const bits = [];
    if (v(rec, "発送日時")) { bits.push("発送 " + fmtDate(v(rec, "発送日時"))); }
    if (v(rec, "追跡番号")) { bits.push("追跡番号 " + v(rec, "追跡番号")); }
    if (v(rec, "送達結果")) { bits.push("送達 " + v(rec, "送達結果")); }
    bits.push("No." + v(rec, "$id"));
    detail.textContent = bits.join("｜");
    card.appendChild(detail);
    ship.appendChild(card);
  }
  const chat = document.getElementById("chat");
  if (data.chat_count === null) {
    chat.textContent = "LINE 連携がないため、やり取りはありません";
  } else {
    chat.textContent = `${data.chat_count}` +
      (data.chat_count_capped ? "+" : "") +
      " 件のやり取りがあります（本文はこの画面では表示しません）";
  }
}
load();
</script>
</body>
</html>
