<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案件詳細 - 案件管理（仮）</title>
<style>
body{font-family:sans-serif;max-width:960px;margin:1.5rem auto;padding:0 1rem}
table{border-collapse:collapse;width:100%;margin-bottom:1.2rem}
th,td{border:1px solid #ccc;padding:.35rem .6rem;font-size:.95rem;text-align:left;word-break:break-all}
th{width:12em;background:#f6f6f6}
h2{margin:.8rem 0 .4rem}
a{color:#1a3c6e}
</style>
</head>
<body>
<h1>案件詳細</h1>
<p><a href="/app/cases">← 案件一覧</a></p>
<!-- P4-002: read-only（表示のみ）。kintone レコードの素通し表示（裁定: 内部専用・
     kintone 直視と同格）。App28 は件数のみ（本文表示は別票） -->
<h2>案件（App21）</h2>
<table id="case"></table>
<h2>発送管理（App30・この案件の絞込）</h2>
<table id="shipping"><thead><tr><th>ID</th><th>件名</th><th>チャネル</th><th>方向</th><th>発送ステータス</th><th>発送日時</th><th>追跡番号</th><th>送達結果</th></tr></thead><tbody id="shiprows"></tbody></table>
<h2>チャット（App28）</h2>
<p id="chat"></p>
<script>
function v(rec, name) { return (rec[name] && rec[name].value) || ""; }
function td(text) { const e = document.createElement("td"); e.textContent = text; return e; }
async function load() {
  const id = new URLSearchParams(location.search).get("id") || "";
  if (!/^[0-9]{1,10}$/.test(id)) { document.body.textContent = "不正な ID"; return; }
  const resp = await fetch("/app/api/cases/" + id, {redirect: "follow"});
  if (resp.redirected || !resp.headers.get("content-type")?.includes("json")) {
    location.href = "/app/login"; return;
  }
  if (!resp.ok) { document.getElementById("case").textContent = "取得できませんでした"; return; }
  const data = await resp.json();
  const caseTable = document.getElementById("case");
  for (const [name, field] of Object.entries(data.case)) {
    if (name.startsWith("$")) continue;
    const tr = document.createElement("tr");
    const th = document.createElement("th"); th.textContent = name;
    tr.appendChild(th);
    tr.appendChild(td(typeof field.value === "string" ? field.value
                      : JSON.stringify(field.value)));
    caseTable.appendChild(tr);
  }
  const rows = document.getElementById("shiprows");
  for (const rec of data.shipping) {
    const tr = document.createElement("tr");
    for (const name of ["$id", "件名", "チャネル", "方向", "発送ステータス",
                        "発送日時", "追跡番号", "送達結果"]) {
      tr.appendChild(td(v(rec, name)));
    }
    rows.appendChild(tr);
  }
  const chat = document.getElementById("chat");
  if (data.chat_count === null) {
    chat.textContent = "件数取得なし（LINE 連携なし）";
  } else {
    chat.textContent = `発話件数: ${data.chat_count}` +
      (data.chat_count_capped ? "+（上限到達）" : "") + "（本文表示は別票）";
  }
}
load();
</script>
</body>
</html>
