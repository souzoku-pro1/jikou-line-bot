<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>相続人関係図 - 案件管理（仮）</title>
<style>
body{font-family:sans-serif;max-width:960px;margin:1.5rem auto;padding:0 1rem}
label,button,input{font-size:1rem;margin-right:.6rem}
input{width:8rem}
a{color:#1a3c6e}
.figure{border:1px solid #ccc;border-radius:8px;padding:.8rem;margin:.6rem 0;overflow:auto}
.figure img{max-width:100%}
.notice{border:1px solid #b8860b;background:#fff8e1;border-radius:6px;padding:.6rem;margin:.6rem 0}
.problems{border:1px solid #b22222;background:#fff0f0;border-radius:6px;padding:.6rem;margin:.6rem 0}
.warn{color:#8a5a00;font-size:.9rem}
.meta{color:#555;font-size:.9rem;margin:.3rem 0}
table{border-collapse:collapse;margin:.4rem 0}
td,th{border:1px solid #ccc;padding:.3rem .6rem;font-size:.95rem}
</style>
</head>
<body>
<h1>相続人関係図</h1>
<p><a href="/app">← ダッシュボード</a></p>
<!-- P4-005: 参照のみ——確定・書込み操作の UI はこの画面に存在しない。
     図は Z2（graphviz）のサーバ生成 SVG を img の data URI で表示する
     （img 文脈は script を実行しない・DOM は createElement/textContent のみ）。
     導出結果の重畳は凡例テーブル（未確定注記を常時表示・機械は確定しない） -->
<div>
  <label>案件No <input id="case" inputmode="numeric" placeholder="例: 9"></label>
  <button id="load">表示</button>
</div>
<div id="out"></div>
<script>
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
async function load() {
  const out = document.getElementById("out");
  out.replaceChildren();
  const caseId = document.getElementById("case").value.trim();
  if (!/^[0-9]{1,10}$/.test(caseId)) {
    out.appendChild(el("div", "problems", "案件Noは数字で入力してください"));
    return;
  }
  const resp = await fetch("/app/api/kinship?case=" + encodeURIComponent(caseId),
                           {redirect: "follow"});
  if (resp.redirected || !resp.headers.get("content-type")?.includes("json")) {
    location.href = "/app/login"; return;
  }
  if (!resp.ok) {
    out.appendChild(el("div", "problems", "取得に失敗しました（案件Noを確認してください）"));
    return;
  }
  const data = await resp.json();
  if (data.status === "empty" || data.status === "unavailable") {
    out.appendChild(el("div", "problems", data.message));
    return;
  }
  if (data.status === "not_renderable") {
    // Z1「拒否は道案内」: 誰の何が未充足かをそのまま列挙（白画面にしない）
    const box = el("div", "problems");
    box.appendChild(el("div", "", "描画前提が未充足です。次を確認してください:"));
    const ul = document.createElement("ul");
    for (const p of data.problems) ul.appendChild(el("li", "", p));
    box.appendChild(ul);
    out.appendChild(box);
    renderOverlay(out, data);
    return;
  }
  const fig = el("div", "figure");
  const img = document.createElement("img");
  // SVG は server 生成（graphviz）。img の data URI 表示は script 実行文脈を
  // 持たない（HTML 文字列系 API は本画面で使用しない）
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(data.svg);
  img.alt = "相続関係図（案件 No." + data.case_record_id + "）";
  fig.appendChild(img);
  out.appendChild(fig);
  for (const w of data.warnings || []) {
    out.appendChild(el("div", "warn", "注意: " + w));
  }
  renderOverlay(out, data);
}
function renderOverlay(out, data) {
  const ov = data.overlay;
  if (!ov) {
    out.appendChild(el("div", "meta",
      "導出結果はまだありません（図のみ表示・重畳なし）"));
    return;
  }
  out.appendChild(el("div", "notice", "【未確定】" + ov.notice));
  out.appendChild(el("div", "meta",
    `導出 run #${ov.run_id}｜status: ${ov.run_status}` +
    `｜参考値(provisional): ${ov.provisional ? "yes" : "no"}`));
  const table = document.createElement("table");
  const head = document.createElement("tr");
  for (const h of ["相続人（App34）", "続柄（導出）", "法定相続分（導出）"]) {
    head.appendChild(el("th", "", h));
  }
  table.appendChild(head);
  const names = data.names || {};
  for (const heir of ov.heirs) {
    const tr = document.createElement("tr");
    const name = names[heir.person_id] || "";
    tr.appendChild(el("td", "", `No.${heir.person_id} ${name}`));
    tr.appendChild(el("td", "", heir.zokugara || "（旧形式・再導出で表示）"));
    tr.appendChild(el("td", "", heir.share_display || "—"));
    table.appendChild(tr);
  }
  out.appendChild(table);
}
document.getElementById("load").addEventListener("click", load);
document.getElementById("case").addEventListener("keydown", (e) => {
  if (e.key === "Enter") load();
});
</script>
</body>
</html>
