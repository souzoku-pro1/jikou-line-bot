<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案件管理（仮）</title>
<link rel="manifest" href="/app/manifest.json">
<link rel="apple-touch-icon" href="/app/icons/icon-192.png">
<style>
/* UI-POLISH-1: 質問画面と統一の配色・カード型ダッシュボード */
body{font-family:sans-serif;max-width:720px;margin:0 auto;
  padding:.6rem 1rem 2rem;box-sizing:border-box;background:#eef1f5;color:#222}
h1{font-size:1.25rem;margin:.4rem 0 .1rem}
.sub{color:#667;font-size:.85rem;margin:0 0 .9rem}
.stats{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.4rem}
.stat{flex:1;min-width:8.5rem;background:#fff;border:1px solid #d8dde5;
  border-radius:14px;padding:.7rem .9rem;text-align:center}
.stat .num{font-size:1.6rem;font-weight:bold;color:#1a3c6e;display:block}
.stat .num.attn{color:#a04000}
.stat .lbl{color:#667;font-size:.8rem}
.navcard{display:block;background:#fff;border:1px solid #d8dde5;
  border-radius:14px;padding:.9rem 1rem;margin:.6rem 0;text-decoration:none;
  color:#1a3c6e;font-size:1.05rem;font-weight:bold}
.navcard .desc{display:block;color:#8a8f98;font-size:.8rem;font-weight:normal;
  margin-top:.15rem}
.navcard.disabled{color:#98a0ab;font-weight:normal}
</style>
</head>
<body>
<h1>案件管理（仮）</h1>
<p class="sub">事務所ダッシュボード</p>
<div class="stats">
  <div class="stat"><span class="num" id="n-souzoku">…</span>
    <span class="lbl">相続案件</span></div>
  <div class="stat"><span class="num" id="n-jikou">…</span>
    <span class="lbl">時効案件</span></div>
  <div class="stat"><span class="num attn" id="n-approvals">…</span>
    <span class="lbl">返信の承認待ち</span></div>
</div>
<a class="navcard" href="/app/souzoku">相続案件
  <span class="desc">案件ごとの相続人・財産・書類・進行状況</span></a>
<a class="navcard" href="/app/q">質問（チャット）
  <span class="desc">記録を調べて答えます——「◯◯さんの相続人は？」など</span></a>
<a class="navcard" href="/app/approvals">返信の承認
  <span class="desc">お客様への返信下書きの確認（承認の操作は LINE から）</span></a>
<a class="navcard" href="/app/cases">時効案件
  <span class="desc">時効援用の案件一覧・発送状況</span></a>
<a class="navcard" href="/app/kinship">相続人関係図
  <span class="desc">家系図の形で相続関係を確認</span></a>
<div class="navcard disabled">書類の到着確認
  <span class="desc">準備中</span></div>
<script src="/app/app.js"></script>
<script src="/app/shell.js"></script>
<script>
// 件数サマリー: 取得できないときは「−」（画面は落とさない）。
// app_fetch の第1引数は各呼出しでリテラル固定（ラッパー規律の流儀）。
// UI-POLISH-1-fix1（UI-POLISH-01）: HTTP エラー（!resp.ok）も取得不能として
// 「−」へ縮退（4xx/5xx の JSON が「0件」に化けない）。判定は純関数
// countText に集約（テストが同一アルゴリズムで挙動 pin）。各呼出しは独立の
// try/catch＝1 API の失敗が他の表示を妨げない
function countText(ok, records, cap) {
  if (!ok || !Array.isArray(records)) { return "−"; }
  var n = records.length;
  return n >= cap ? cap + "+" : "" + n;
}
async function fillCount(respPromise, elId, cap) {
  const node = document.getElementById(elId);
  try {
    const resp = await respPromise;
    if (resp.redirected ||
        !resp.headers.get("content-type")?.includes("json")) {
      location.href = "/app/login"; return;
    }
    const data = resp.ok ? await resp.json() : null;
    node.textContent = countText(resp.ok, data && data.records, cap);
  } catch (e) {
    node.textContent = "−";
  }
}
fillCount(app_fetch("/app/api/souzoku/cases?limit=50"), "n-souzoku", 50);
fillCount(app_fetch("/app/api/cases?limit=20"), "n-jikou", 20);
fillCount(app_fetch("/app/api/approvals?limit=20"), "n-approvals", 20);
</script>
</body>
</html>
